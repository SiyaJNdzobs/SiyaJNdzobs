name: Update GitHub Activity Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: SiyaJNdzobs
        run: |
          python .github/scripts/generate_dashboard.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-dashboard.svg

          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "Update GitHub activity dashboard"
            git push
          fi
